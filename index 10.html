<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Leonida">
<meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="IMG_9971.jpeg"><link rel="icon" href="IMG_9971.jpeg"><title>Leonida (Unofficial Fan Project)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:"Avenir Next",Futura,"Trebuchet MS",sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--w:100vw;--h:56.25vw}
#plw{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#000}
#pl{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%);border:0;pointer-events:none}
#title{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .6s}
#title.off{opacity:0;pointer-events:none}
#start{font:inherit;font-weight:600;color:#fff;letter-spacing:.5em;font-size:15px;padding:14px 30px 14px 40px;border:1.5px solid #c08bff;border-radius:3px;background:rgba(138,61,255,.1);text-shadow:0 0 6px #d4b0ff,0 0 16px #a96bff,0 0 30px #8a3dff;box-shadow:0 0 8px #a96bff,0 0 26px rgba(138,61,255,.6),inset 0 0 14px rgba(138,61,255,.5);animation:neon 2.6s ease-in-out infinite}
#start:active{background:rgba(169,107,255,.45)}
@keyframes neon{0%,100%{opacity:1}50%{opacity:.72;box-shadow:0 0 4px #a96bff,0 0 14px rgba(138,61,255,.45),inset 0 0 8px rgba(138,61,255,.35)}}
#note{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;opacity:.4}
#cover{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:20;transition:opacity .6s}
#cover.hide{opacity:0;pointer-events:none}
#go{display:none;font:inherit;color:#fff;letter-spacing:.2em;padding:14px 34px;border:0;border-radius:999px;background:linear-gradient(#a96bff,#6a2cd8)}
#msg{font-size:15px;opacity:.85;max-width:440px}
#sticks{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:15;pointer-events:none}
#sticks.on{display:block}
.stick{pointer-events:auto;position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
#jl{left:calc(40px + env(safe-area-inset-left))}#jr{right:calc(40px + env(safe-area-inset-right))}
.kn{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:rgba(169,107,255,.75);box-shadow:0 0 14px rgba(169,107,255,.6)}
</style></head><body>
<div id="plw"><div id="pl"></div></div>
<div id="sticks"><div class="stick" id="jl"><div class="kn" id="kl"></div></div><div class="stick" id="jr"><div class="kn" id="kr"></div></div></div>
<div id="title"><button id="start">START</button><div id="note">Unofficial fan project. Not affiliated with Rockstar Games.</div></div>
<div id="cover" class="hide"><div id="msg"></div><button id="go">CONTINUE</button></div>
<script>
var IDS=['rz1B4B2yBZY','R97EoVD1nr4'],i=0,P=null,ready=false,failed=false,iv=null,gt=null,adv=false,tapAct=null;
function $(s){return document.getElementById(s)}
var ys=document.createElement('script');ys.src='https://www.youtube.com/iframe_api';ys.onerror=function(){failed=true};document.head.appendChild(ys);
window.onYouTubeIframeAPIReady=function(){ready=true};
function fit(){var vw=innerWidth,vh=innerHeight,w=Math.max(vw,vh*16/9);document.documentElement.style.setProperty('--w',w+'px');document.documentElement.style.setProperty('--h',(w*9/16)+'px')}
fit();addEventListener('resize',fit);
function black(){$('go').style.display='none';$('msg').textContent='';$('cover').className=''}
function hideCover(){$('cover').className='hide'}
function prompt2(t,fn){tapAct=fn;$('msg').textContent=t;$('go').style.display='block';$('cover').className=''}
$('go').onclick=function(){var f=tapAct;tapAct=null;$('go').style.display='none';$('msg').textContent='';if(f)f()};
$('start').onclick=function(){$('title').classList.add('off');i=0;adv=false;black();begin()};
function begin(){black();var n=0,w=setInterval(function(){if(ready){clearInterval(w);mk()}else if(failed||++n>100){clearInterval(w);prompt2('Could not load YouTube. Check your connection, then tap to retry.',begin)}},100)}
function mk(){$('plw').innerHTML='<div id="pl"></div>';P=new YT.Player('pl',{videoId:IDS[0],playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3,cc_load_policy:0,vq:'hd1080',enablejsapi:1},
 events:{onReady:function(e){e.target.unMute();e.target.setVolume(100);try{e.target.setPlaybackQuality('hd1080')}catch(x){}e.target.playVideo();guard()},onStateChange:st,onError:err}});iv=setInterval(tick,300)}
function guard(){clearTimeout(gt);gt=setTimeout(function(){if(!P||!P.getPlayerState)return;var s=P.getPlayerState();
 if(s!==1&&s!==3)prompt2('Tap to continue with sound',function(){P.unMute();P.setVolume(100);P.playVideo();guard()});
 else if(P.isMuted&&P.isMuted())prompt2('Tap to turn the sound on',function(){P.unMute();P.setVolume(100);hideCover()})},2500)}
function play(n){i=n;adv=false;$('sticks').classList.remove('on');P.loadVideoById({videoId:IDS[n],suggestedQuality:'hd1080'});P.unMute();P.setVolume(100);guard()}
function st(e){if(e.data===1){hideCover();$('sticks').classList.toggle('on',i===IDS.length-1);try{P.unMute();P.setVolume(100);P.setPlaybackQuality('hd1080');P.unloadModule('captions')}catch(x){}}
 if(e.data===2&&!document.hidden){setTimeout(function(){if(P.getPlayerState()===2)P.playVideo()},150)}
 if(e.data===0)next()}
function tick(){if(P&&P.getPlayerState&&P.getPlayerState()===1&&!adv){var d=P.getDuration(),t=P.getCurrentTime();if(d>5&&t>=d-.7)next()}}
function next(){if(adv)return;adv=true;$('sticks').classList.remove('on');black();setTimeout(function(){if(i<IDS.length-1)play(i+1);else toTitle()},650)}
function err(){prompt2('This video is unavailable. Tap to continue.',function(){adv=false;next()})}
function toTitle(){clearInterval(iv);clearTimeout(gt);try{P.stopVideo();P.destroy()}catch(x){}P=null;$('plw').innerHTML='<div id="pl"></div>';hideCover();$('title').classList.remove('off')}
// pretend joysticks (visual only, they do not control the video)
function stick(el,kn){var id=null;function mv(t){var b=el.getBoundingClientRect(),dx=t.clientX-(b.left+b.width/2),dy=t.clientY-(b.top+b.height/2),m=Math.min(1,Math.hypot(dx,dy)/(b.width*.4)),a=Math.atan2(dy,dx);kn.style.transform='translate('+Math.cos(a)*m*b.width*.3+'px,'+Math.sin(a)*m*b.width*.3+'px)'}
 function rs(){id=null;kn.style.transform=''}
 el.addEventListener('touchstart',function(e){e.preventDefault();if(id===null){id=e.changedTouches[0].identifier;mv(e.changedTouches[0])}},{passive:false});
 el.addEventListener('touchmove',function(e){e.preventDefault();for(var n=0;n<e.changedTouches.length;n++)if(e.changedTouches[n].identifier===id)mv(e.changedTouches[n])},{passive:false});
 el.addEventListener('touchend',function(e){for(var n=0;n<e.changedTouches.length;n++)if(e.changedTouches[n].identifier===id)rs()});el.addEventListener('touchcancel',rs)}
stick($('jl'),$('kl'));stick($('jr'),$('kr'));
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
</script></body></html>
